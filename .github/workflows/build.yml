name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-3ds:
    name: 3DS app
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # 3ds-mbedtls and 3ds-libjpeg-turbo ship with the devkitarm image; pkg.devkitpro.org
      # rejects downloads from CI runners, so check for them instead of installing.
      - name: Check 3DS libraries
        run: |
          test -f "$DEVKITPRO/portlibs/3ds/include/jpeglib.h" || { echo "::error::3ds-libjpeg-turbo missing from image"; exit 1; }
          grep -m1 'define MBEDTLS_VERSION_STRING ' "$DEVKITPRO/portlibs/3ds/include/mbedtls/version.h"
          # certificate pinning reads the peer certificate after the handshake
          grep -E '^#define MBEDTLS_SSL_KEEP_PEER_CERTIFICATE' "$DEVKITPRO/portlibs/3ds/include/mbedtls/config.h" \
            || { echo "::error::mbedTLS built without MBEDTLS_SSL_KEEP_PEER_CERTIFICATE"; exit 1; }

      - name: Build .3dsx
        working-directory: 3ds
        run: make APP_VERSION="${GITHUB_SHA::7}"

      - uses: actions/upload-artifact@v5
        with:
          name: wa3ds-3dsx
          path: 3ds/wa3ds.3dsx
          if-no-files-found: error

      # the ELF is only an input for the CIA job, not a release asset
      - uses: actions/upload-artifact@v5
        with:
          name: build-3ds-elf
          path: 3ds/wa3ds.elf
          if-no-files-found: error
          retention-days: 3

  package-cia:
    name: 3DS .cia
    needs: build-3ds
    runs-on: ubuntu-latest
    env:
      MAKEROM_URL: https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
      BANNERTOOL_URL: https://github.com/carstene1ns/3ds-bannertool/releases/download/1.2.3/bannertool-1.2.3-linux.tar.gz
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          name: build-3ds-elf
          path: 3ds

      - name: Install makerom and bannertool
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL -o makerom.zip "$MAKEROM_URL"
          unzip -q makerom.zip
          curl -fsSL "$BANNERTOOL_URL" | tar xz --strip-components=1
          chmod +x makerom bannertool
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - name: Build .cia
        working-directory: 3ds
        run: |
          bannertool makebanner -i assets/banner.png -a assets/banner.wav -o wa3ds.bnr
          bannertool makesmdh -s "WA3DS" -l "WA3DS - WhatsApp for 3DS (${GITHUB_SHA::7})" \
            -p "leanderkuehnel0" -i assets/icon.png -o wa3ds.icn
          makerom -f cia -o wa3ds.cia -target t -exefslogo -rsf cia.rsf \
            -elf wa3ds.elf -icon wa3ds.icn -banner wa3ds.bnr \
            -major 1 -minor 0 -micro 0
          ls -l wa3ds.cia
          test -s wa3ds.cia

      - name: Check .cia contents
        working-directory: 3ds
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ctrtool.zip" https://github.com/3DSGuy/Project_CTR/releases/download/ctrtool-v1.3.0/ctrtool-v1.3.0-ubuntu_x86_64.zip
          unzip -q -o "$RUNNER_TEMP/ctrtool.zip" -d "$RUNNER_TEMP/tools" && chmod +x "$RUNNER_TEMP/tools/ctrtool"
          ctrtool -i wa3ds.cia > cia-info.txt 2>&1 || true
          grep -iE "title ?id|product ?code|program ?id|version" cia-info.txt | head -12
          for svc in ps:ps mic:u dsp::DSP soc:U fs:USER; do
            grep -q "$svc" cia-info.txt || { echo "::error::service $svc missing from .cia"; exit 1; }
          done
          grep -qi "000400000f3da500" cia-info.txt || { echo "::error::unexpected title ID"; exit 1; }
          echo "services and title ID OK"
          # the code must not be compressed (see EnableCompress in cia.rsf)
          grep -iE "compress" cia-info.txt || true
          if grep -iE "compress(ed)? ?(exefs ?)?code[^:]*: *(yes|true|1)" cia-info.txt; then
            echo "::error::.cia code is compressed"; exit 1
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: wa3ds-cia
          path: 3ds/wa3ds.cia
          if-no-files-found: error

  build-bridge:
    name: Bridge (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: Build
        working-directory: bridge
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go vet ./...
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" \
            -o dist/wa3ds-bridge-linux-${{ matrix.goarch }} .

      - uses: actions/upload-artifact@v5
        with:
          name: wa3ds-bridge-${{ matrix.goarch }}
          path: bridge/dist/*
          if-no-files-found: error

  release:
    name: Publish rolling release
    needs: [build-3ds, package-cia, build-bridge]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: rolling
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: wa3ds-*
          merge-multiple: true

      - name: Move rolling tag to this commit
        run: |
          if gh api "repos/$GH_REPO/git/refs/tags/$TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          fi

      - name: Create or update release
        run: |
          short="${GITHUB_SHA::7}"
          notes="Automated build of \`$short\` from \`main\` ($(date -u +'%Y-%m-%d %H:%M UTC')).

          - \`wa3ds.cia\`: install with FBI (shows up on the HOME Menu)
          - \`wa3ds.3dsx\`: or copy to \`sd:/3ds/\` and launch from the Homebrew Launcher
          - \`wa3ds-bridge-linux-*\`: bridge server for your VPS"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Rolling build ($short)" --notes "$notes" --prerelease
          else
            gh release create "$TAG" --title "Rolling build ($short)" --notes "$notes" --prerelease --verify-tag
          fi

      - name: Upload assets
        run: gh release upload "$TAG" dist/* --clobber
